name: Add KnowToDrive Resource

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-knowtodrive.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make official online test resource bilingual
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          lines = [
              '<section class="services" id="official-online-test">',
              '  <div class="credentials-card">',
              '    <div class="credentials-icon">📝</div>',
              '    <h3>Official Nevada Online Knowledge Test</h3>',
              '    <p>Take the official Nevada driver knowledge exam online from home through KnowTo Drive, the testing platform used by the Nevada DMV.</p>',
              '    <a class="credentials-btn" href="https://knowtodrive.com/nevada/" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none;">Start the Official Online Test</a>',
              '    <hr style="border:0;border-top:1px solid rgba(255,215,0,.25);margin:30px auto;max-width:520px;">',
              '    <h3>Examen Oficial de Conocimientos de Nevada</h3>',
              '    <p>Tome desde casa el examen oficial de conocimientos para conducir en Nevada por medio de KnowTo Drive, la plataforma de evaluación utilizada por el DMV de Nevada.</p>',
              '    <a class="credentials-btn" href="https://knowtodrive.com/nevada/" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none;">Comenzar el Examen Oficial en Línea</a>',
              '    <p style="font-size:0.82rem;margin-top:24px;color:#888;">External website / Sitio web externo. Solo DMV Services does not administer the exam and is not affiliated with KnowTo Drive, the Nevada DMV, or any government agency. Solo DMV Services no administra el examen ni está afiliado con KnowTo Drive, el DMV de Nevada o ninguna agencia gubernamental.</p>',
              '  </div>',
              '</section>',
          ]
          section = "\n".join(lines)

          pattern = re.compile(
              r'<section class="services" id="official-online-test">.*?</section>',
              re.DOTALL,
          )

          if pattern.search(text):
              text = pattern.sub(section, text, count=1)
          else:
              marker = '<footer id="footer-text">'
              if marker not in text:
                  raise SystemExit("Footer marker not found; no changes made.")
              text = text.replace(marker, section + "\n" + marker, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit homepage update
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add full Spanish version to Nevada online test resource"
          git push
