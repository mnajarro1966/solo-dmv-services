name: Add KnowToDrive Resource

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-knowtodrive.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add official online test resource
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<footer id="footer-text">'
          section = '''
<section class="services" id="official-online-test">
  <div class="credentials-card">
    <div class="credentials-icon">📝</div>
    <h3>Official Nevada Online Knowledge Test</h3>
    <p>
      Take the official Nevada driver knowledge exam online from home through
      KnowTo Drive, the testing platform used by the Nevada DMV.
    </p>
    <a class="credentials-btn" href="https://knowtodrive.com/nevada/"
       target="_blank" rel="noopener noreferrer"
       style="display:inline-block;text-decoration:none;">
      Start the Official Online Test
    </a>
    <p style="font-size:0.82rem;margin-top:22px;color:#888;">
      External website. Solo DMV Services does not administer the exam and is not
      affiliated with KnowTo Drive, the Nevada DMV, or any government agency.
    </p>
    <p style="font-size:0.95rem;margin-top:18px;">
      <strong style="color:gold;">Examen oficial de conocimientos en línea:</strong><br>
      El enlace abre el sitio externo de KnowTo Drive. Solo DMV Services no administra
      el examen ni está afiliado con KnowTo Drive o el DMV de Nevada.
    </p>
  </div>
</section>

'''

          if 'id="official-online-test"' not in text:
              if marker not in text:
                  raise SystemExit('Footer marker not found; no changes made.')
              text = text.replace(marker, section + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit homepage update
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add official Nevada online knowledge test link"
          git push
